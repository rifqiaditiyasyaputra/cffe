name: Build Flutter & Dart Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter & Dart SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Check Dart & Flutter version
        run: |
          flutter --version
          dart --version

      - name: Get Dart & Flutter dependencies
        run: flutter pub get

      - name: Run Dart & Flutter unit tests
        run: flutter test

      - name: Build Android Release APK with Dart & Flutter
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KopiKita-app-release.apk
          path: build/app/outputs/flutter-apk/app-release.apk
